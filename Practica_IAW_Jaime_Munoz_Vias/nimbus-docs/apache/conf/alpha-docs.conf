<VirtualHost *:8080>
    ServerName alpha-docs.lan
    DocumentRoot /var/www/alpha-docs
    ErrorLog /usr/local/apache2/logs/alpha_error.log
    CustomLog /usr/local/apache2/logs/alpha_access.log combined

    <Directory /var/www/alpha-docs>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
