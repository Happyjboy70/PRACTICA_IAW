<VirtualHost *:8080>
    ServerName beta-docs.lan
    DocumentRoot /var/www/beta-docs
    ErrorLog /usr/local/apache2/logs/beta_error.log
    CustomLog /usr/local/apache2/logs/beta_access.log combined

    <Directory /var/www/beta-docs>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Files "config-db.json">
        Require all denied
    </Files>
</VirtualHost>
