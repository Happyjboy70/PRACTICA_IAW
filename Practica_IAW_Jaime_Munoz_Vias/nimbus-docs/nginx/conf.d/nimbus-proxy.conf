server {
    listen 80;
    server_name alpha-docs.lan beta-docs.lan;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name alpha-docs.lan beta-docs.lan;

    ssl_certificate /etc/nginx/ssl/nimbus.crt;
    ssl_certificate_key /etc/nginx/ssl/nimbus.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad requeridas
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        limit_req zone=nimbus_limit burst=6 nodelay;
        proxy_pass http://apache:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
